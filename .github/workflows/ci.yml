name: CI — Build & Test

# 觸發條件：push 到 main 或任何 PR
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest   # GitHub 的免費 Linux 虛擬機

    steps:
      # 1. 把代碼拉下來
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 .NET 10 SDK（與你的 Tests.csproj 目標框架一致）
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. 還原所有 NuGet 套件（Moq, FluentAssertions, xUnit...）
      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./

      # 4. 編譯整個 Solution
      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: ./

      # 5. ⭐ 核心：跑所有測試（必須全部通過才繼續）
      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: ./
        # 如果任何測試失敗，這個 step 返回非零退出碼
        # GitHub Actions 會標記整個 workflow 為 ❌ 失敗
        # Render 的 auto-deploy 不受阻（見下方說明）

