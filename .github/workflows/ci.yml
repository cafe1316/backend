name: CI — Build & Test

# 觸發條件：push 到 dev 或任何 PR
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. 把代碼拉下來
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 .NET 9 SDK
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 3. 只還原 Tests 項目及其依賴（Domain, Application）
      # 不還原 API，避免 Microsoft.NET.Sdk.Web 的 glob bug
      - name: Restore Test project
        run: dotnet restore Cafe1316.Tests/Cafe1316.Tests.csproj

      # 4. 只 Build Tests 項目（自動帶出 Domain + Application）
      - name: Build Test project
        run: dotnet build Cafe1316.Tests/Cafe1316.Tests.csproj --no-restore --configuration Release

      # 5. ⭐ 核心：跑所有測試（必須全部通過才繼續）
      - name: Run tests
        run: dotnet test Cafe1316.Tests/Cafe1316.Tests.csproj --no-build --configuration Release --verbosity normal

