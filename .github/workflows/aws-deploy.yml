name: Backend CI and AWS Lambda Deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Cafe1316.slnx

      - name: Build solution
        run: dotnet build Cafe1316.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Cafe1316.Tests/Cafe1316.Tests.csproj --no-build --configuration Release --verbosity normal

  deploy:
    name: Build image and deploy to Lambda
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
      API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY"
          test -n "$LAMBDA_FUNCTION_NAME"
          test -n "$API_GATEWAY_URL"
          test -n "$AWS_DEPLOY_ROLE_ARN"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cafe1316-github-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable and deployment tags
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --file Dockerfile --tag "$IMAGE_URI:$IMAGE_TAG" --tag "$IMAGE_URI:latest" .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

      - name: Deploy immutable image to Lambda
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --publish
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Verify API Gateway health endpoint
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            "${API_GATEWAY_URL%/}/health"
